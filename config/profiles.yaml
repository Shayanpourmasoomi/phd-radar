# Postings about economics with no match above show up here (adjacent tier,
# labelled with this field).  Set to false to hide generic economics postings.
include_generic_economics: true
generic_who: [shayan, zahra]

# ---------------------------------------------------------------------------
# Strong terms that are only trusted when the posting is clearly about
# economics (otherwise "climate change" / "urban" / "poverty" would pull in
# natural-science, planning and medical postings).
# ---------------------------------------------------------------------------
