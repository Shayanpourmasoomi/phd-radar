# ---------------------------------------------------------------------------
# What to look for.  Edit freely - changes apply on the next run (no network
# needed: python -m agent rescore).
#
# Scoring (per field):
#   strong term in TITLE  = +6      strong term in body/snippet = +3 (once per term)
#   support term in TITLE = +2      support term in body/snippet = +1
#   support terms only count when the posting is clearly about economics.
# tier "strong"   : best field score >= 6
# tier "adjacent" : economics posting with a weaker/no topic signal, or a topic
#                   signal without the word "economics" (shown, but ranked lower)
# anything else   : rejected (kept in output/rejected.csv so you can audit recall)
# ---------------------------------------------------------------------------

people:
  shayan: "Shayan"
  zahra: "Zahra"

# Words that prove a posting is about economics (needed for support terms and
# for the 'adjacent' tier).  Matched on accent-stripped lowercase text.
economics_anchor:
  # substring match (so "macroeconometrics", "socioeconomic", "Volkswirtschaftslehre" all count)
  title_or_org_substrings:
    - "econom"
    - "volkswirtschaft"
    - "wirtschaftswissenschaft"
    - "wirtschaftsforschung"
    - "wirtschaftspolitik"
    - "okonom"
    - "oekonom"
    - "ekonom"
  title_or_org_terms:
    - "public policy"
    - "market design"
  body_min_hits: 3          # the substring "econom" must appear this many times in the body

# Topics that make a posting a poor fit even if it mentions economics.
# A posting is rejected when these score >= 3 and no topic field reaches 6.
negative_terms:
  - "corporate finance"
  - "asset pricing"
  - "financial economics"
  - "financial markets"
  - "financial intermediation"
  - "macro-finance"
  - "macrofinance"
  - "household finance"
  - "banking"
  - "fintech"
  - "accounting"
  - "auditing"
  - "marketing"
  - "consumer behaviour"
  - "consumer behavior"
  - "organizational behaviour"
  - "organizational behavior"
  - "operations management"
  - "supply chain"
  - "logistics"
  - "information systems"
  - "business informatics"
  - "entrepreneurship"
  - "strategic management"
  - "human resource management"
  - "risk management"
  - "actuarial"
  - "portfolio"
  - "derivatives"
  - "investment"

