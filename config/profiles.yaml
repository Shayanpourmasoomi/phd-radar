      - "regional economics"
      - "economic geography"
      - "agglomeration"
      - "housing market*"
      - "housing economics"
      - "housing policy"
      - "real estate economics"
      - "transport economics"
      - "transportation economics"
      - "public transport*"
      - "metro"
      - "commuting"
      - "land use"
      - "land-use"
      - "urbanization"
      - "urbanisation"
      - "spatial econometrics"
      - "geospatial"
